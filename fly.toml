# fly.toml app configuration file generated for recipes-michiel on 2026-11-26T20:30:40+01:00
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'recipes-michiel'
primary_region = 'ams'
kill_signal = 'SIGTERM'

[build]
[deploy]
  release_command = '/app/bin/migrate'

[env]
  PHX_HOST = 'recipes-michiel.fly.dev'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 1000
    soft_limit = 1000

[[vm]]
  memory = '1gb'
  cpus = 1
