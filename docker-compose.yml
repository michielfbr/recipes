# Local development database.
#
#   docker compose up -d
#   mix ecto.setup
#
# Port 5432 matches the hostname/port defaults in config/dev.exs and
# config/test.exs. If you move it, update those too.
services:
  db:
    image: postgres:17-alpine
    container_name: recipes-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
